<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | Stackly Architecture</title>

    <link rel="stylesheet" href="404.css">
</head>

<body>

    <!-- GRID BACKGROUND -->
    <div class="grid-bg"></div>

    <!-- FLOATING PARTICLES -->
    <div class="particles" id="particles"></div>



    <!-- MAIN ERROR CONTENT -->
    <div class="error-wrap">

        <!-- Blueprint Icon -->
        <div class="blueprint-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="1" />
                <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
                <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" opacity=".4" />
            </svg>
        </div>

        <!-- 404 Number -->
        <div class="error-num">404</div>

        <!-- Gold Line -->
        <div class="gold-divider"></div>

        <!-- Text -->
        <h1 class="error-title">Blueprint Not Found</h1>
        <!-- Action Buttons -->
        <div class="error-actions">
            <a href="index.html" class="btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span>Return Home</span>
            </a>
            <a href="javascript:history.back()" class="btn-outline">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Go Back</span>
            </a>
        </div>

    </div>



    <script>

        // Generate floating particles
        const container = document.getElementById('particles');
        for (let i = 0; i < 28; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.setProperty('--x', Math.random() * 100 + 'vw');
            p.style.setProperty('--dur', (6 + Math.random() * 10) + 's');
            p.style.setProperty('--delay', (Math.random() * 8) + 's');
            p.style.width = (2 + Math.random() * 3) + 'px';
            p.style.height = p.style.width;
            container.appendChild(p);
        }

        // Glitch flicker on 404 number
        const num = document.querySelector('.error-num');
        setInterval(() => {
            if (Math.random() > 0.92) {
                num.style.textShadow = '2px 0 #cfa73c, -2px 0 rgba(255,0,100,.3)';
                setTimeout(() => { num.style.textShadow = 'none'; }, 80);
            }
        }, 1200);
    </script>

</body>

</html>
